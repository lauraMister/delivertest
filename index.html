<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindAR Image Tracking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">
    
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            font-family: 'Manrope', sans-serif;
        }
        #welcome-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: #faf8fc;
            overflow: hidden;
        }
        #welcome-screen::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/papyros.png');
            opacity: 0.1;
            pointer-events: none;
        }
        .ui-button {
            background-color: #ffd700;
            color: #333;
            border: none;
            padding: 15px 50px;
            font-size: 1.2em;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            min-width: 200px;
            text-align: center;
        }
        .ui-button:active {
            transform: scale(0.95);
            background-color: #e6c200;
        }
        #welcome-text {
            color: #ffd700;
            margin-bottom: 20px;
            text-align: center;
            padding: 0 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .fade-out-up {
            opacity: 0;
            transform: translateY(-30px);
            transition: all 0.8s ease;
        }
        .fade-in-up {
            opacity: 1 !important;
            transform: translateY(0) !important;
            transition: all 0.8s ease;
        }
        #instructions {
            opacity: 0;
            transform: translateY(30px);
            position: absolute;
            color: #ffd700;
            text-align: center;
            padding: 0 20px;
            pointer-events: none;
            top: 25%;
            font-size: 2em;
        }
        #typing-text {
            color: #faf8fc;
            font-family: inherit;
            font-size: 1.1em;
            text-transform: lowercase;
            margin-top: 10px;
            min-height: 3em;
            text-align: center;
            padding: 0 20px;
            max-width: 80%;
            opacity: 0;
            position: absolute;
            top: 38%;
            line-height: 1.4;
        }
        .cursor::after {
            content: '_';
            animation: blink 0.7s infinite;
            color: #ffd700;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
        #start-button {
            margin-top: 150px;
        }
        #start-button.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
        }
    </style>
</head>
<body>
    <div id="welcome-screen">
        <h1 id="welcome-text">SCENARIO NUMERO 1</h1>
        <h1 id="instructions">ISTRUZIONI</h1>
        <p id="typing-text"></p>
        <button id="start-button" class="ui-button">inizia</button>
    </div>

    <!-- Aggiunto autoStart: false per evitare conflitti con i click dell'interfaccia -->
    <a-scene id="ar-scene" mindar-image="imageTargetSrc: assets/target.mind; autoStart: false;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" style="display: none;">
        <a-assets>
            <video id="ar-video" src="assets/video.mp4" loop crossorigin="anonymous" playsinline></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-video src="#ar-video" width="1" height="0.5625" position="0 0 0" rotation="0 0 0"></a-video>
        </a-entity>
    </a-scene>

    <script src="app.js"></script>
</body>
</html>
