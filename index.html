<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>Scenario Numero 1</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
            font-family: "Manrope", sans-serif;
        }


        /* ==============================
           SCHERMATA INIZIALE
        ============================== */

        #welcome-screen {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            background:
                linear-gradient(
                    135deg,
                    #0f2027 0%,
                    #203a43 50%,
                    #2c5364 100%
                );

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            color: #faf8fc;

            z-index: 1000;

            overflow: hidden;
        }


        #welcome-screen::before {
            content: "";

            position: absolute;
            inset: 0;

            background-image:
                url("https://www.transparenttextures.com/patterns/papyros.png");

            opacity: 0.1;

            pointer-events: none;
        }


        /* ==============================
           SCENARIO
        ============================== */

        #welcome-text {
            position: relative;

            margin: 0 20px 20px;

            color: #ffd700;

            text-align: center;

            font-size: clamp(2rem, 9vw, 3rem);
            font-weight: 800;

            text-shadow:
                2px 2px 4px rgba(0, 0, 0, 0.5);

            transition:
                opacity 0.8s ease,
                transform 0.8s ease;
        }


        .fade-out-up {
            opacity: 0;

            transform:
                translateY(-30px);
        }


        /* ==============================
           ISTRUZIONI
        ============================== */

        #instructions {
            position: absolute;

            top: 25%;

            width: 100%;

            padding: 0 20px;

            margin: 0;

            color: #ffd700;

            font-size: clamp(2rem, 9vw, 3rem);
            font-weight: 800;

            text-shadow:
                2px 2px 4px rgba(0, 0, 0, 0.5);

            text-align: center;

            opacity: 0;

            transform:
                translateY(30px);

            pointer-events: none;

            transition:
                opacity 0.8s ease,
                transform 0.8s ease;
        }


        #instructions.fade-in-up {
            opacity: 1;

            transform:
                translateY(0);
        }


        #typing-text {
            position: absolute;

            top: 38%;

            width: 80%;
            max-width: 500px;

            min-height: 3em;

            margin: 0;

            color: #faf8fc;

            font-size: clamp(1rem, 4.5vw, 1.25rem);

            line-height: 1.4;

            text-align: center;

            text-transform: lowercase;

            opacity: 0;
        }


        .cursor::after {
            content: "_";

            color: #ffd700;

            animation:
                blink 0.7s infinite;
        }


        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }


        /* ==============================
           PULSANTE
        ============================== */

        #start-button {
            position: relative;

            margin-top: 150px;

            min-width: 200px;

            padding: 15px 50px;

            border: none;
            border-radius: 30px;

            background: #ffd700;

            color: #333;

            font-family: inherit;
            font-size: 1.2rem;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 2px;

            cursor: pointer;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.3);

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }


        #start-button:active {
            transform:
                scale(0.95);
        }


        #start-button.hidden {
            opacity: 0;

            pointer-events: none;

            transform:
                scale(0.8);
        }


        /* ==============================
           CONTENITORE AR
        ============================== */

        #ar-container {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 1;
        }


        /* ==============================
           MESSAGGI AR
        ============================== */

        #ar-message {
            position: fixed;

            z-index: 500;

            top: 25px;
            left: 50%;

            transform:
                translateX(-50%);

            padding: 10px 18px;

            border-radius: 20px;

            background:
                rgba(0, 0, 0, 0.65);

            color: white;

            font-size: 14px;

            text-align: center;

            display: none;

            pointer-events: none;
        }

    </style>


    <!-- Import map Three.js + MindAR -->

    <script type="importmap">
    {
        "imports": {
            "three":
                "https://unpkg.com/three@0.160.0/build/three.module.js",

            "three/addons/":
                "https://unpkg.com/three@0.160.0/examples/jsm/",

            "mindar-image-three":
                "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
    }
    </script>

</head>


<body>


    <!-- ==============================
         INTRO
    ============================== -->

    <div id="welcome-screen">

        <h1 id="welcome-text">
            SCENARIO<br>NUMERO 1
        </h1>


        <h1 id="instructions">
            ISTRUZIONI
        </h1>


        <p id="typing-text"></p>


        <button id="start-button">
            inizia
        </button>

    </div>



    <!-- ==============================
         AR
    ============================== -->

    <div id="ar-container"></div>


    <div id="ar-message">
        Inquadra la mappa
    </div>



    <!-- Video usato come texture AR -->

    <video
        id="ar-video"
        src="./asset/video.mp4"
        loop
        muted
        playsinline
        webkit-playsinline
        preload="auto"
        style="position:fixed; width:1px; height:1px; opacity:0; pointer-events:none;"
    ></video>



    <script
        type="module"
        src="./app.js"
    ></script>


</body>

</html>
