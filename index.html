<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>MindAR Test</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #ar-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: fixed;
            z-index: 9999;
            top: 20px;
            left: 20px;
            right: 20px;
        }

        #startButton {
            font-size: 20px;
            padding: 15px 25px;
        }

        #status {
            margin-top: 10px;
            padding: 10px;
            background: white;
            color: black;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
    }
    </script>
</head>

<body>

    <div id="ui">
        <button id="startButton">AVVIA AR</button>
        <div id="status">Pagina caricata</div>
    </div>

    <div id="ar-container"></div>

    <script type="module" src="./app.js"></script>

</body>
</html>
