<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AR Image Tracking - MindAR & Three.js</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #ar-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
    </style>

    <script src="https://unpkg.com/three@0.160.0/build/three.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>
</head>

<body>
    <div id="ar-container"></div>

    <script src="./app.js"></script>
</body>
</html>
